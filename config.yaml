# ─── SLM Project Evaluator Configuration ───
# Model hyperparameters and infrastructure settings.
# All scripts read from this file. Override per-stage as needed.

model:
  path: models/gguf/qwen2.5-1.5b-instruct-q4_k_m.gguf
  n_ctx: 2048
  n_gpu_layers: 0

cpu:
  # Percentage of available CPU threads to use (10-100)
  percent: 50

# Default generation parameters (applied to all stages unless overridden)
defaults:
  max_tokens: 250
  temperature: 0.1
  repeat_penalty: 1.3
  top_p: 1.0

# Per-stage overrides (merged on top of defaults)
stages:
  stage1_workflow:
    max_tokens: 500
    temperature: 0.0
    repeat_penalty: 1.1

  stage2_problems:
    max_tokens: 500
    temperature: 0.0
    repeat_penalty: 1.1

  stage3_solutions:
    max_tokens: 500
    temperature: 0.0
    repeat_penalty: 1.1

  stage4_evaluation:
    max_tokens: 400
    temperature: 0.0
    repeat_penalty: 1.1

# Project evaluator (evaluate.py / evaluate_fast.py)
evaluator:
  max_tokens: 768
  temperature: 0.3
  repeat_penalty: 1.1
  top_p: 0.9

evaluator_fast:
  n_ctx: 1024
  max_tokens: 384
  temperature: 0.0
  repeat_penalty: 1.0
